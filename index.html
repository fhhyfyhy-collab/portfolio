/* ── 导航 ── */

.burger{display:none;width:30px;height:30px;border:0;background:none;position:relative;cursor:pointer}
.burger i{position:absolute;left:3px;right:3px;height:1px;background:var(--ink);transition:transform .25s,opacity .2s}
.burger i:nth-child(1){top:10px}.burger i:nth-child(2){top:15px}.burger i:nth-child(3){top:20px}
.burger[aria-expanded="true"] i:nth-child(1){transform:translateY(5px) rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){opacity:0}
.burger[aria-expanded="true"] i:nth-child(3){transform:translateY(-5px) rotate(-45deg)}

/* ── 首屏 ── */

.hero-sub{margin-top:clamp(20px,3.5vh,34px);font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--muted)}

/* ── 分区 ── */
.sec{max-width:1560px;margin:0 auto;padding:clamp(56px,8vh,96px) var(--pad) clamp(64px,9vh,110px);scroll-margin-top:62px}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 clamp(18px,2vw,32px);align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:clamp(30px,4vh,48px)}

.sec-head p{font-size:12.5px;line-height:1.8;color:var(--muted);text-align:right;padding-bottom:2px}

/* ── 作品网格 ── */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(28px,3.4vw,46px) clamp(18px,2vw,30px)}
.work{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.thumb{display:block;position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--paper-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.16,.84,.44,1),filter .4s}
.work:hover .thumb img{transform:scale(1.038)}

.work:hover .work-title{color:var(--accent)}
.work-meta{display:block;margin-top:7px;font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.work-desc{display:block;margin-top:9px;font-size:13px;line-height:1.65;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.album .thumb{aspect-ratio:4/3}
.album .thumb img{filter:saturate(.96)}
.alb-views{display:inline-block;margin-left:10px;color:var(--muted)}


/* ── 页脚 ── */
.foot{max-width:1560px;margin:0 auto;padding:36px var(--pad) 48px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
.foot a{text-decoration:none;transition:color .2s}
.foot a:hover{color:var(--accent)}

/* ── 响应式 ── */
@media(max-width:1100px){
  .sec-head{grid-template-columns:1fr;gap:0;align-items:start}

@media(max-width:860px){

}

/* ---------- 工具 ---------- */
var esc = function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var META = function(parts){ return parts.filter(Boolean).join(' · ') };
var fmt = function(n){ return n > 9999 ? (n/10000).toFixed(1).replace(/\.0$/,'') + ' 万' : String(n) };
/* 本地预览（file:// 或 localhost）时，本地已有的新素材走相对路径，其余回落到线上；发布后一律相对路径 */
var IS_LOCAL = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
var LOCAL_DIRS = ['tour/', 'plan/', 'expo/', 'albums/', 'thumbs/', 'thumbs_expo/'];
function linkUrl(f){
  if(!IS_LOCAL) return f;
  for(var i=0;i<LOCAL_DIRS.length;i++){ if(f.indexOf(LOCAL_DIRS[i]) === 0) return f; }
  return 'https://www.luhuahua.com/' + f;
}
/* 卡片链接到网页阅读页（每页图片流），PDF 作为下载入口放在阅读页内 */
function href(f){ return esc(encodeURI(linkUrl(f.replace(/\.pdf$/i, '.html')))); }

/* ---------- 渲染 ---------- */
function renderTours(){
  var st = document.getElementById('statFoot');
  if(st) st.textContent = TOURS.length + ' 旅游 · ' + PROJECTS.length + ' 方案 · ' + ALBUMS.length + ' 相册 · ' + EXPOS.length + ' 展厅';
  document.getElementById('tourGrid').innerHTML = TOURS.map(function(t,i){
    var a = esc(t.title);
    var meta = META([t.destination, t.days ? t.days + '天' : '', t.client]);
    return '<a class="work" href="'+href(t.file)+'" target="_blank" rel="noopener">'
      + '<span class="thumb"><img src="'+esc(t.thumb)+'" alt="'+a+'" loading="lazy" width="480" height="270"></span>'
      + '<span class="work-title">'+a+'</span>'
      + '<span class="work-meta">'+esc(meta)+'</span>'
      + '<span class="work-desc">'+esc(t.preview||'')+'</span>'
      + '</a>';
  }).join('');
}

function renderProjects(){
  document.getElementById('grid').innerHTML = PROJECTS.map(function(p){
    var a = esc(p.title);
    var meta = META([p.client, p.role, p.year]);
    return '<a class="work" href="'+href(p.file)+'" target="_blank" rel="noopener">'
      + '<span class="thumb"><img src="'+esc(p.thumb)+'" alt="'+a+'" loading="lazy" width="400" height="225"></span>'
      + '<span class="work-title">'+a+'</span>'
      + '<span class="work-meta">'+esc(meta)+'</span>'
      + '<span class="work-desc">'+esc(p.preview||'')+'</span>'
      + '</a>';
  }).join('');
}

function renderAlbums(){
  document.getElementById('albumGrid').innerHTML = ALBUMS.map(function(a){
    var n = esc(a.name);
    var v = a.views ? '<span class="alb-views">'+fmt(a.views)+' 次浏览</span>' : '';
    return '<a class="work album" href="'+esc(a.url)+'" target="_blank" rel="noopener">'
      + '<span class="thumb"><img src="'+esc(a.thumb)+'" alt="'+n+'" loading="lazy" width="300" height="300"></span>'
      + '<span class="work-title">'+n+'</span>'
      + '<span class="work-meta">'+esc(META([a.sub, a.platform]))+v+'</span>'
      + '</a>';
  }).join('');
}

function renderExpos(){
  document.getElementById('expoGrid').innerHTML = EXPOS.map(function(e){
    var t = esc(e.title);
    var meta = META([e.client, e.type]);
    return '<a class="work" href="'+href(e.file)+'" target="_blank" rel="noopener">'
      + '<span class="thumb"><img src="'+esc(e.thumb)+'" alt="'+t+'" loading="lazy" width="480" height="270"></span>'
      + '<span class="work-title">'+t+'</span>'
      + '<span class="work-meta">'+esc(meta)+'</span>'
      + '<span class="work-desc">'+esc(e.desc)+'</span>'
      + '</a>';
  }).join('');
}


/* ---------- 导航 ---------- */
var burger = document.getElementById('burger'), navLinks = document.getElementById('navLinks');
burger.addEventListener('click', function(){
  var open = navLinks.classList.toggle('open');
  burger.setAttribute('aria-expanded', open ? 'true' : 'false');
});
navLinks.addEventListener('click', function(e){
  if(e.target.tagName === 'A'){ navLinks.classList.remove('open'); burger.setAttribute('aria-expanded','false'); }
});

var links = document.querySelectorAll('.nav-links a');
var sections = ['top','espace-1','espace-2','espace-3','espace-4'].map(function(id){return document.getElementById(id)});
var onScroll = function(){
  var y = window.scrollY + 130, idx = 0;
  for(var i=0;i<sections.length;i++){ if(sections[i] && y >= sections[i].offsetTop) idx = i; }
  links.forEach(function(a){ a.classList.remove('active'); });
  var cur = document.querySelector('.nav-links a[href="#'+sections[idx].id+'"]');
  if(cur) cur.classList.add('active');
};
window.addEventListener('scroll', onScroll, {passive:true});

renderTours(); renderProjects(); renderAlbums(); renderExpos(); onScroll();
</script>
</body>
</html>
