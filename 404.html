﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF8F5">
<title>页面不存在 · 卢发达作品集</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316130F'/%3E%3Ctext x='16' y='22' font-family='Noto Serif SC,SimSun,serif' font-size='15' font-weight='bold' fill='%23FAF8F5' text-anchor='middle'%3E%E5%8D%A2%3C/text%3E%3C/svg%3E">
<style>
:root{--paper:#FAF8F5;--ink:#16130F;--muted:#8C8378;--line:#E2DBD1;--accent:#B23A20;--serif:'Noto Serif SC','Songti SC',SimSun,Georgia,serif;--sans:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:var(--paper);color:var(--ink);font-family:var(--sans);text-align:center;padding:32px 24px}
.brand{position:fixed;top:0;left:0;right:0;height:62px;display:flex;align-items:center;padding:0 20px;font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.brand a{color:var(--ink);text-decoration:none}
.code{font-family:var(--serif);font-size:clamp(72px,16vw,132px);font-weight:800;line-height:1;color:var(--accent);opacity:.16;letter-spacing:.02em}
h1{font-family:var(--serif);font-size:clamp(20px,3vw,26px);font-weight:700;margin-top:-6px}
p{font-size:13.5px;line-height:1.8;color:var(--muted);margin-top:12px}
a.btn{display:inline-block;margin-top:28px;padding:11px 26px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font-size:13.5px;letter-spacing:.04em;transition:background .2s,color .2s}
a.btn:hover{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<div class="brand"><a href="/">卢发达作品集</a></div>
<div class="code">404</div>
<h1>这个页面不存在</h1>
<p>链接可能已经更新，或者地址输错了。</p>
<a class="btn" href="/">返回作品集首页</a>
</body>
</html>
